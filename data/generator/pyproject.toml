[project]
name = "zt-generator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zt-core", "psycopg[binary]>=3.2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zt_generator"]
[tool.uv.sources]
zt-core = { workspace = true }
