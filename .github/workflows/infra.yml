name: Infra (Vultr)

# plan on PRs that touch Terraform; plan / apply / destroy on demand. Apply and destroy run in the
# protected "vultr" environment, so a reviewer must approve before anything paid is created or deleted.
on:
  pull_request:
    paths: ["infra/vultr/terraform/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply or destroy"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: infra-vultr
  cancel-in-progress: false

env:
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
  TF_VAR_ssh_public_key: ${{ secrets.ZENTRY_SSH_PUBLIC_KEY }}
  TF_VAR_admin_cidr: ${{ secrets.ZENTRY_ADMIN_CIDR }}
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/vultr/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: init (state in Vultr Object Storage)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config='endpoints={s3="${{ secrets.TF_STATE_ENDPOINT }}"}' \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_KEY }}"
      - run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = require('fs').readFileSync('infra/vultr/terraform/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: '### Terraform plan (Vultr)\n```\n' + plan + '\n```' });

  apply:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment: vultr
    defaults: { run: { working-directory: infra/vultr/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config='endpoints={s3="${{ secrets.TF_STATE_ENDPOINT }}"}' \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_KEY }}"
      - if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve
      - if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
      - if: inputs.action == 'apply'
        run: terraform output -json | jq '{public_ips, private_ips, coolify_dashboard, vpc_id}'
