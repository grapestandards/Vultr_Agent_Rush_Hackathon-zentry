[project]
name = "zt-trainer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zt-core", "zt-generator", "lightgbm>=4.5", "numpy>=1.26", "scikit-learn>=1.5", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zt_trainer"]

[tool.uv.sources]
zt-core = { workspace = true }
zt-generator = { workspace = true }
