[project]
name = "zt-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zt-core", "nats-py>=2.9", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zt_worker"]
[tool.uv.sources]
zt-core = { workspace = true }
