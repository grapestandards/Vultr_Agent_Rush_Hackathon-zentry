[project]
name = "zt-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zt-core", "zt-trainer", "nats-py>=2.9", "psycopg[binary]>=3.2", "lightgbm>=4.5", "numpy>=1.26", "openai>=1.50", "httpx>=0.27", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zt_worker"]
[tool.uv.sources]
zt-core = { workspace = true }
zt-trainer = { workspace = true }
