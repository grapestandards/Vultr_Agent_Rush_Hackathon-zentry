[project]
name = "zt-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["zt-core", "fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "pydantic>=2.8", "nats-py>=2.9", "httpx>=0.27", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zt_api"]
[tool.uv.sources]
zt-core = { workspace = true }
