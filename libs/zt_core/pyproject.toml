[project]
name = "zt-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["networkx>=3.3", "scipy>=1.13", "numpy>=1.26", "nats-py>=2.9", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zt_core"]
